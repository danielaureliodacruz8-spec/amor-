workflows:
  android-debug:
    name: Amor — Vendas da Cássia (APK de teste)
    max_build_duration: 120
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Gerar estrutura Android
        script: flutter create --platforms=android --org br.com.amorvendas --project-name amor_vendas_cassia .
      - name: Instalar dependências
        script: flutter pub get
      - name: Gerar APK de teste
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk

